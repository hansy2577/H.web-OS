<!DOCTYPE html>
<html>

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>Terminal</title>
   <link rel="manifest" href="manifest.json" />
<link rel="shortcut icon" type="image/x-icon" href="icon.png">

</head>

<body>
   <hr>
   <iframe src="data/game.html" id="canvas" allowtransparency="false" frameborder="0" width="400" height="500" onscroll="false"></iframe><br>
   <hr>
   <a style="color: white;">></a><input type="text" style="background-color: black; color: white; width: 200px; border: 0px solid black;" frameborder="0" id="input"><button onclick="ok()" style="border: 2px solid white; color: white; background-color: black;" >enter</button>
   
   <style> body { background-color: black; }</style>
   <script>
      function ok(){
         sessionStorage.setItem("command","€"+document.getElementById("input").value);
         document.getElementById("input").value = "";
      }
      
      sessionStorage.setItem("command","€"+"start");
      
      document.addEventListener("keydown",function (e) {
         if (e.key == "Enter" || e.key == "enter") {
            ok();
         }
      })
      
      re();
      
      function re(){
         document.getElementById("canvas").style.height = (window.innerHeight - 70)+"px";
         document.getElementById("canvas").style.width = (window.innerWidth - 30)+"px"

         document.getElementById("input").style.width = (window.innerWidth - 120)+"px"
      }
      
      window.onresize = function () { re(); }
   </script>
</body>

</html>
